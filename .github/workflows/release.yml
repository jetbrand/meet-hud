name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Zip extension
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          mkdir -p dist/pkg
          cp manifest.json protocol.js page-hook.js meet-devices.js \
            model.js hud.js content.js hud.css dist/pkg/
          python3 -c "
          import json
          from pathlib import Path
          path = Path('dist/pkg/manifest.json')
          data = json.loads(path.read_text())
          data['version'] = '${tag}'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          "
          (cd dist/pkg && zip -r "../meet-noise-alert-${GITHUB_REF_NAME}.zip" .)

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
