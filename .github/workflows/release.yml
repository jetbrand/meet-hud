name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Zip extension
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          mkdir -p dist/pkg/icons
          cp manifest.json protocol.js page-hook.js meet-devices.js \
            model.js hud.js content.js hud.css dist/pkg/
          cp icons/icon16.png icons/icon48.png icons/icon128.png dist/pkg/icons/
          python3 -c "
          import json
          from pathlib import Path
          path = Path('dist/pkg/manifest.json')
          data = json.loads(path.read_text())
          data['version'] = '${tag}'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          "
          (cd dist/pkg && zip -r "../meet-noise-alert-${GITHUB_REF_NAME}.zip" .)

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
